apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      containers:
      - name: booking
        image: docker.io/rajeswari1929/booking-service:lab2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
        env:
        - name: PORT
          value: "8003"
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/airbnb"
        - name: KAFKA_BROKER
          value: "kafka-service:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  type: LoadBalancer
  selector:
    app: booking
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003

apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-deployment
  labels:
    app: property
spec:
  replicas: 1
  selector:
    matchLabels:
      app: property
  template:
    metadata:
      labels:
        app: property
    spec:
      containers:
        - name: property-container
          image: property-service:lab2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: MONGODB_URI
              value: "mongodb://mongo:27017/airbnb"

            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "airbnb_user"
            - name: DB_PASSWORD
              value: "YourStrong#Pass123"
            - name: DB_NAME
              value: "airbnb_app"
---
apiVersion: v1
kind: Service
metadata:
  name: property-service
  labels:
    app: property
spec:
  selector:
    app: property
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP
